\<!doctype html>
\<html lang="vi">
\<head>
\<meta charset="utf-8">
\<meta name="viewport" content="width=device-width,initial-scale=1">
\<title>JLPT N5 → N1 Study Deck\</title>
\<style>
\:root{
  \--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;
  \--primary:#3157d5;--primary2:#eef2ff;--ok:#14804a;--okbg:#eaf7ef;
  \--bad:#c4320a;--badbg:#fff0eb;--shadow:0 14px 40px rgba(16,24,40,.08)
}
\*{box-sizing\:border-box}
body{margin:0;background\:var(--bg);color\:var(--text);font-family\:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select,textarea{font\:inherit}
button{cursor\:pointer;border:0}
.app{max-width:1120px;margin\:auto;padding:22px}
header{display\:flex;justify-content\:space-between;gap:16px;align-items\:flex-start;margin-bottom:18px}
h1{font-size:29px;margin:0 0 4px}
.sub{color\:var(--muted);font-size:14px}
.pill{font-size:12px;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3345a3;white-space\:nowrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:16px}
.top-controls{display\:grid;grid-template-columns:140px 170px 170px 1fr;gap:10px}
select,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color\:var(--text)}
.tabs{display\:flex;gap:8px;flex-wrap\:wrap;margin-top:12px}
.btn{border-radius:10px;padding:10px 14px;background:#eef1f6;color:#344054}
.btn.active,.btn.primary{background\:var(--primary);color\:white}
.btn.good{background\:var(--okbg);color\:var(--ok)}
.btn.bad{background\:var(--badbg);color\:var(--bad)}
.btn\:disabled{opacity:.45;cursor\:not-allowed}
.stats{display\:grid;grid-template-columns\:repeat(5,1fr);gap:9px;margin-top:13px}
.stat{border:1px solid var(--line);background:#f9fafb;border-radius:11px;padding:9px;text-align\:center;font-size:12px;color\:var(--muted)}
.stat b{display\:block;color\:var(--text);font-size:18px;margin-bottom:2px}
.progress{height:8px;background:#e9edf5;border-radius:999px;overflow\:hidden;margin-top:12px}
.progress span{display\:block;height:100%;background\:var(--primary);width:0}
.statusline{font-size:13px;color\:var(--muted);margin-top:9px;min-height:19px}

.deck{perspective:1400px;min-height:430px}
.card{position\:relative;min-height:430px;width:100%;transform-style\:preserve-3d;transition\:transform .42s;cursor\:pointer}
.card.flipped{transform\:rotateY(180deg)}
