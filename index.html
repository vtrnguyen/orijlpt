<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JLPT N5 Flashcards - Riki Vocabulary</title>
<style>
:root {
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085;
  --line:#e4e7ec; --primary:#3157d5; --ok:#14804a; --bad:#c4320a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1040px;margin:auto;padding:24px}
h1{margin:0 0 6px;font-size:28px}
.sub{color:var(--muted);margin-bottom:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
select,input,button{font:inherit}
select,input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eef2ff;color:#2d46a6}
.good{background:#e9f7ef;color:var(--ok)}
.bad{background:#fff0eb;color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.card-wrap{perspective:1200px;min-height:380px}
.card{position:relative;width:100%;min-height:380px;transform-style:preserve-3d;transition:.45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;
display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;text-align:center;box-shadow:0 12px 35px rgba(16,24,40,.08)}
.back{transform:rotateY(180deg)}
.badge{position:absolute;top:18px;left:18px;padding:5px 10px;border-radius:999px;background:#eef2ff;color:#3449a1;font-size:13px}
.kanji{font-size:72px;font-weight:700;line-height:1.1;margin-bottom:16px}
.kana{font-size:31px;margin-bottom:8px}
.meaning{font-size:31px;font-weight:700;margin-bottom:14px}
.hint{font-size:14px;color:var(--muted);position:absolute;bottom:18px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:16px}
.progress{height:9px;background:#e9edf5;border-radius:999px;overflow:hidden;margin:16px 0 0}
.progress span{display:block;height:100%;background:var(--primary)}
.source{font-size:12px;color:var(--muted);margin-top:14px}
kbd{background:#eef0f4;border:1px solid #d0d5dd;border-bottom-width:2px;border-radius:5px;padding:1px 5px}
@media(max-width:700px){
 .app{padding:14px} .controls{grid-template-columns:1fr 1fr} .stats{grid-template-columns:1fr 1fr}
 .kanji{font-size:52px} .kana,.meaning{font-size:25px} .actions{grid-template-columns:1fr 1fr} .card,.card-wrap{min-height:340px}
}
</style>
</head>
<body>
<div class="app">
  <h1>🇯🇵 JLPT N5 Flashcards</h1>
  <div class="sub">Học từ vựng theo danh sách đang hiển thị trên bài viết Riki Nihongo.</div>

  <div class="panel">
    <div class="controls">
      <select id="category">
        <option value="all">Tất cả nhóm</option>
      </select>
      <select id="mode">
        <option value="jp-vi">Nhật → Việt</option>
        <option value="vi-jp">Việt → Nhật</option>
      </select>
      <select id="statusFilter">
        <option value="all">Tất cả trạng thái</option>
        <option value="new">Chưa học</option>
        <option value="known">Đã nhớ</option>
        <option value="review">Cần ôn</option>
      </select>
      <input id="search" placeholder="Tìm Kanji/Kana/nghĩa...">
    </div>
    <div class="stats">
      <div class="stat"><b id="totalStat">0</b>Từ trong bộ lọc</div>
      <div class="stat"><b id="knownStat">0</b>Đã nhớ</div>
      <div class="stat"><b id="reviewStat">0</b>Cần ôn</div>
      <div class="stat"><b id="newStat">0</b>Chưa học</div>
    </div>
    <div class="progress"><span id="progressBar" style="width:0%"></span></div>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>

  <div class="actions">
    <button class="secondary" id="prev">← Trước</button>
    <button class="bad" id="review">↺ Cần ôn</button>
    <button class="good" id="known">✓ Đã nhớ</button>
    <button class="secondary" id="next">Tiếp →</button>
  </div>

  <div class="actions">
    <button class="secondary" id="flip">Lật thẻ <kbd>Space</kbd></button>
    <button class="secondary" id="shuffle">Xáo trộn</button>
    <button class="secondary" id="reset">Reset tiến độ</button>
    <button class="primary" id="random">Từ ngẫu nhiên</button>
  </div>

  <div class="source">
    Nguồn dữ liệu: https://riki.edu.vn/goc-chia-se/tu-vung-n5/ ·
    Trạng thái học được lưu trực tiếp trên trình duyệt bằng localStorage.
  </div>
</div>

, "kanji": "", "kana": "いかが", "meaning": "như thế nào (lịch sự của どう)"}, {"category": "Khác", "kanji": "", "kana": "いくつ", "meaning": "bao nhiêu cái, bao nhiêu tuổi"}, {"category": "Khác", "kanji": "", "kana": "いくら", "meaning": "bao nhiêu (hỏi giá)"}, {"category": "Khác", "kanji": "", "kana": "いつ", "meaning": "khi nào"}, {"category": "Khác", "kanji": "", "kana": "いつも", "meaning": "luôn luôn"}, {"category": "Khác", "kanji": "", "kana": "ええ", "meaning": "vâng, có"}, {"category": "Khác", "kanji": "先", "kana": "さき", "meaning": "trước"}, {"category": "Khác", "kanji": "", "kana": "しかし", "meaning": "tuy nhiên"}, {"category": "Khác", "kanji": "", "kana": "すぐに", "meaning": "ngay lập tức"}, {"category": "Khác", "kanji": "", "kana": "その", "meaning": "~ đó"}, {"category": "Khác", "kanji": "", "kana": "それから", "meaning": "sau đó"}, {"category": "Khác", "kanji": "", "kana": "それでは", "meaning": "vậy thì, thế thì"}, {"category": "Khác", "kanji": "", "kana": "たくさん", "meaning": "nhiều"}, {"category": "Khác", "kanji": "", "kana": "たぶん", "meaning": "có thể, có lẽ"}, {"category": "Khác", "kanji": "誰", "kana": "だれ", "meaning": "ai, người nào"}, {"category": "Khác", "kanji": "誰", "kana": "だれか", "meaning": "ai đó"}, {"category": "Khác", "kanji": "", "kana": "だんだん", "meaning": "dần dần"}, {"category": "Khác", "kanji": "", "kana": "ちょうど", "meaning": "vừa đúng, vừa đủ"}, {"category": "Khác", "kanji": "", "kana": "ちょっと", "meaning": "một ít, một chút"}, {"category": "Khác", "kanji": "次", "kana": "つぎ", "meaning": "tiếp theo"}, {"category": "Khác", "kanji": "", "kana": "どう", "meaning": "như thế nào"}, {"category": "Khác", "kanji": "", "kana": "どうして", "meaning": "tại sao"}, {"category": "Khác", "kanji": "", "kana": "どうぞ", "meaning": "xin mời"}, {"category": "Khác", "kanji": "", "kana": "どこ", "meaning": "chỗ nào"}, {"category": "Khác", "kanji": "", "kana": "どちら", "meaning": "phía nào"}, {"category": "Khác", "kanji": "", "kana": "どっち", "meaning": "phía nào (thân mật)"}, {"category": "Khác", "kanji": "", "kana": "どれ", "meaning": "cái nào"}, {"category": "Khác", "kanji": "", "kana": "なぜ", "meaning": "tại sao"}, {"category": "Khác", "kanji": "", "kana": "など", "meaning": "vân vân"}, {"category": "Khác", "kanji": "何", "kana": "なん/なに", "meaning": "gì, cái gì"}, {"category": "Khác", "kanji": "", "kana": "はい", "meaning": "vâng, có"}, {"category": "Khác", "kanji": "", "kana": "ほか", "meaning": "khác"}, {"category": "Khác", "kanji": "", "kana": "まっすぐ", "meaning": "thẳng"}, {"category": "Khác", "kanji": "", "kana": "さあ", "meaning": "dùng để chuyển đề tài"}];
const STORAGE_KEY = "jlpt_n5_riki_flashcards_v1";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let filtered = [];
let index = 0;
let flipped = false;

const $ = id => document.getElementById(id);
const category = $("category"), mode = $("mode"), statusFilter = $("statusFilter"), search = $("search");
const card = $("card"), front = $("front"), back = $("back");

[...new Set(WORDS.map(w=>w.category))].forEach(c => {
  const o=document.createElement("option"); o.value=c; o.textContent=c; category.appendChild(o);
});

function key(w) { return [w.category,w.kanji,w.kana,w.meaning].join("|"); }
function getStatus(w) { return state[key(w)] || "new"; }
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function applyFilters(resetIndex=true) {
  const q=search.value.trim().toLowerCase();
  filtered = WORDS.filter(w => {
    const catOk = category.value==="all" || w.category===category.value;
    const statOk = statusFilter.value==="all" || getStatus(w)===statusFilter.value;
    const text=(w.kanji+" "+w.kana+" "+w.meaning).toLowerCase();
    return catOk && statOk && (!q || text.includes(q));
  });
  if(resetIndex) index=0;
  if(index>=filtered.length) index=Math.max(0,filtered.length-1);
  flipped=false;
  render();
}

function faceHTML(w, side) {
  const jp = `
    <div class="badge">${w.category}</div>
    <div class="kanji">${w.kanji || w.kana}</div>
    ${w.kanji ? `<div class="kana">${w.kana}</div>` : ""}
    <div class="hint">Nhấn vào thẻ hoặc Space để lật</div>`;
  const vi = `
    <div class="badge">${w.category}</div>
    <div class="meaning">${w.meaning}</div>
    <div class="kana">${w.kana}</div>
    ${w.kanji ? `<div style="font-size:28px;margin-top:8px">${w.kanji}</div>` : ""}
    <div class="hint">Trạng thái: ${getStatus(w)==="known"?"Đã nhớ":getStatus(w)==="review"?"Cần ôn":"Chưa học"}</div>`;
  if(mode.value==="jp-vi") return side==="front" ? jp : vi;
  const viFront = `<div class="badge">${w.category}</div><div class="meaning">${w.meaning}</div><div class="hint">Đoán từ tiếng Nhật rồi lật thẻ</div>`;
  const jpBack = `<div class="badge">${w.category}</div><div class="kanji">${w.kanji || w.kana}</div>${w.kanji?`<div class="kana">${w.kana}</div>`:""}<div class="hint">Trạng thái: ${getStatus(w)==="known"?"Đã nhớ":getStatus(w)==="review"?"Cần ôn":"Chưa học"}</div>`;
  return side==="front" ? viFront : jpBack;
}

function render() {
  card.classList.toggle("flipped", flipped);
  if(!filtered.length) {
    front.innerHTML='<div class="meaning">Không có từ phù hợp</div><div class="hint">Hãy thay đổi bộ lọc.</div>';
    back.innerHTML=front.innerHTML;
  } else {
    const w=filtered[index];
    front.innerHTML=faceHTML(w,"front");
    back.innerHTML=faceHTML(w,"back");
  }
  const allStatus=WORDS.map(getStatus);
  $("knownStat").textContent=allStatus.filter(x=>x==="known").length;
  $("reviewStat").textContent=allStatus.filter(x=>x==="review").length;
  $("newStat").textContent=allStatus.filter(x=>x==="new").length;
  $("totalStat").textContent=filtered.length;
  const learned=allStatus.filter(x=>x!=="new").length;
  $("progressBar").style.width=(WORDS.length?learned/WORDS.length*100:0)+"%";
}

function flip() { flipped=!flipped; render(); }
function move(step) {
  if(!filtered.length) return;
  index=(index+step+filtered.length)%filtered.length; flipped=false; render();
}
function mark(status) {
  if(!filtered.length) return;
  state[key(filtered[index])]=status; save();
  if(statusFilter.value!=="all") applyFilters(false);
  else move(1);
}

card.onclick=flip; $("flip").onclick=flip;
$("prev").onclick=()=>move(-1); $("next").onclick=()=>move(1);
$("known").onclick=()=>mark("known"); $("review").onclick=()=>mark("review");
$("shuffle").onclick=()=>{ for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]} index=0; flipped=false; render(); };
$("random").onclick=()=>{ if(filtered.length){index=Math.floor(Math.random()*filtered.length);flipped=false;render();} };
$("reset").onclick=()=>{ if(confirm("Xóa toàn bộ tiến độ học?")){state={};save();applyFilters();} };
[category,mode,statusFilter].forEach(el=>el.onchange=()=>applyFilters());
search.oninput=()=>applyFilters();

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(e.code==="Space"){e.preventDefault();flip();}
  else if(e.key==="ArrowRight") move(1);
  else if(e.key==="ArrowLeft") move(-1);
  else if(e.key==="1") mark("review");
  else if(e.key==="2") mark("known");
});

applyFilters();
</script>
